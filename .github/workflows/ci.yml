name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tasks-backend:
    name: Tasks API (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tasks/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/tasks/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          DATABASE_URL: ""
          NOTIF_SCHEDULER: "false"
        run: python manage.py test

  tasks-tenancy:
    name: Tasks multi-company (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/tasks/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/tasks/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Multi-company tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ff_tasks
          DB_SSLMODE: disable
          NOTIF_SCHEDULER: "false"
        run: python manage.py test tenancy accounts.tests_platform --noinput


  assets:
    name: Assets (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: services/assets/.node-version
          cache: npm
          cache-dependency-path: services/assets/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  platform:
    name: Platform (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: services/platform/.node-version
          cache: npm
          cache-dependency-path: services/platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test


  web:
    name: Web app (rules + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run web:build
