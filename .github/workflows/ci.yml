name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the code (docs/security/assets-web-mobile-infra.md).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tasks-backend:
    name: Tasks API (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tasks/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/tasks/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          DATABASE_URL: ""
          NOTIF_SCHEDULER: "false"
        run: python manage.py test

  tasks-tenancy:
    name: Tasks multi-company (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/tasks/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/tasks/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Multi-company tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ff_tasks
          DB_SSLMODE: disable
          NOTIF_SCHEDULER: "false"
        run: python manage.py test tenancy accounts.tests_platform --noinput


  assets:
    name: Assets (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: services/assets/.node-version
          cache: npm
          cache-dependency-path: services/assets/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  platform:
    name: Platform (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: services/platform/.node-version
          cache: npm
          cache-dependency-path: services/platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test


  web:
    name: Web app (rules + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run web:build

  # Known-vulnerable dependencies. Non-blocking for now (report only): flip continue-on-error to false once the
  # findings in docs/security/assets-web-mobile-infra.md are fixed (sharp 0.35.5, Pillow 12.3).
  dependency-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: npm audit (production dependencies)
        run: |
          status=0
          for dir in . services/platform services/assets apps/mobile; do
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: pip-audit (Tasks)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r services/tasks/backend/requirements.txt

  # Secrets must never be committed (CLAUDE.md). Scans the whole history; report only until the first run is reviewed.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose --exit-code 1
